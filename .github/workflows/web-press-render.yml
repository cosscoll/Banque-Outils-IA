name: Web Press — render original Blender scene
on:
  push:
    branches: [main]
    paths:
      - 'demo/web-press/**'
      - '.github/workflows/web-press-render.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: web-press-blender-render
  cancel-in-progress: true
jobs:
  render:
    if: github.repository == 'cosscoll/Banque-Outils-IA' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install free Blender & model validator
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy python3-pil
      - name: Render authored scene
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
        run: |
          echo 'WEB_PRESS_CPU_RENDER_RETRY_2026_10_21'
          blender --background -t 4 --python demo/web-press/scripts/build_webpress.py -- --out demo/web-press/assets --samples 16 --size 1000 > web-press-build.log 2>&1 || (tail -160 web-press-build.log; exit 1)
          grep -q WEBPRESS_G2_ARTIFACTS_OK web-press-build.log
          ls -lh demo/web-press/assets/
          test -s demo/web-press/assets/web-press-original.glb
          test -s demo/web-press/assets/web-press-original.blend
          test -s demo/web-press/assets/01-hero.png
      - name: Upload Blender log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-press-render-log
          path: web-press-build.log
      - name: Generate lightweight visual-review JPEGs
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('demo/web-press/assets')
          for name in ['01-hero','02-exploded','03-macro','04-final']:
              img=Image.open(p/(name+'.png')).convert('RGB')
              img.thumbnail((580,440))
              output=p/('review-'+name+'.jpg')
              img.save(output,'JPEG',quality=66,optimize=True)
              assert output.stat().st_size>5000
              print(output, output.stat().st_size)
          PY
      - name: Validate Blender glTF and save original sources
        run: |
          python - <<'PY'
          import os,struct
          p='demo/web-press/assets/web-press-original.glb'
          with open(p,'rb') as f:h=f.read(12)
          assert h[:4]==b'glTF' and struct.unpack('<I',h[4:8])[0]==2
          for n in ['01-hero.png','02-exploded.png','03-macro.png','04-final.png']:
              p='demo/web-press/assets/'+n
              assert os.path.getsize(p)>5000
          print('GLTF_AND_RENDER_ASSETS_VALID')
          PY
      - name: Commit the new original assets to main
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add demo/web-press/assets/*.png demo/web-press/assets/*.jpg demo/web-press/assets/*.glb demo/web-press/assets/*.blend
          if ! git diff --cached --quiet; then
            git commit -m 'Render original Web Press Blender model, GLB and studio images'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
