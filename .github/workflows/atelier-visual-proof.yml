name: Atelier — real WebGL visual evidence
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atelier-visual-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    if: github.repository == 'cosscoll/Banque-Outils-IA'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for real WebGL rendering
        run: |
          npm install --no-save --no-audit --no-fund --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture WebGL home desktop and mobile with factual diagnostics
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/atelier-server.log 2>&1 &
          mkdir -p artifacts/atelier-gpu
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import {writeFileSync} from 'node:fs';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          let all=[];
          for(const w of [1440,390]){
            const page=await browser.newPage({viewport:{width:w,height:900},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('requestfailed',req=>errors.push(req.url()+':'+req.failure()?.errorText));
            const response=await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'});
            try{await page.waitForFunction(()=>window.__atelierDebug!==undefined,{timeout:20000})}catch(e){}
            await page.waitForTimeout(500);
            const state=await page.evaluate(()=>({
              title:document.title,
              webgl:window.__atelierDebug||null,
              overflow:document.documentElement.scrollWidth-innerWidth,
              canvas:!!document.getElementById('atelier3d'),
              hasWebglClass:document.getElementById('workshop')?.classList.contains('has-webgl'),
              activeMode:document.querySelector('[data-mode][aria-pressed="true"]')?.getAttribute('data-mode')
            }));
            if(page.locator('[data-mode="1"]').count){
              await page.locator('[data-mode="1"]').click();
            }
            state.mode1Active=await page.locator('[data-mode="1"]').getAttribute('aria-pressed');
            await page.screenshot({path:`artifacts/atelier-gpu/home-${w}.png`,fullPage:false});
            all.push({viewport:w,httpStatus:response?.status(),...state,errors});
            console.log('ATELIER_WEBGL_EVIDENCE',JSON.stringify(all[all.length-1]));
            await page.close();
          }
          writeFileSync('artifacts/atelier-gpu/report.json',JSON.stringify(all,null,2));
          await browser.close();
          if(all.some(x=>x.httpStatus!==200||x.webgl?.webgl!==true||!x.hasWebglClass||x.mode1Active!=='true'||x.overflow>2||x.errors.some(y=>/404|ERR_|SyntaxError/.test(y))))process.exit(1);
          JS
      - name: Upload captures even when failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atelier-render-evidence
          path: artifacts/atelier-gpu/
          retention-days: 7
          if-no-files-found: warn
